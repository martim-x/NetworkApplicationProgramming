name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4

      - name: Сборка всех лабораторных
        shell: powershell
        run: ./scripts/build-all.ps1
